# Emails new contact-form enquiries to info@bpsquant.com, sent from the
# fund's own Google Workspace mailbox.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_SERVICE_KEY  Supabase -> Settings -> API -> service_role key
#   GMAIL_APP_PASSWORD    Google Account -> Security -> App passwords
#
# Until both exist the job exits quietly, so it is harmless to merge early.
# Enquiries are never lost either way: they are always saved to Supabase and
# shown in the portal's Inbox tab. This only adds the notification.
name: Email new enquiries

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch: {}       # run on demand from the Actions tab

# One run at a time, so a slow run cannot overlap the next and send twice.
concurrency:
  group: email-new-leads
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TEMPORARY DIAGNOSTIC — remove once the secrets resolve.
      # Prints only the NAMES GitHub has for this repository. Values are
      # never printed; the keys alone settle whether a secret exists here
      # at all, is under a different name, or is somewhere else entirely.
      - name: Which secret names does this repository have
        env:
          ALL_SECRET_NAMES: ${{ toJSON(secrets) }}
        run: |
          python3 - <<'EOF'
          import json, os
          d = json.loads(os.environ["ALL_SECRET_NAMES"])
          names = sorted(k for k in d if k != "github_token")
          print("Secret names this workflow can see:", len(names))
          for n in names:
              print("  -", n)
          if not names:
              print("  (none — nothing is set on this repository for Actions)")
          EOF

      - name: Check the secrets are set
        id: gate
        env:
          SVC: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APP: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Read the Variables tab too, only so the log can say when the
          # values were put there by mistake. Nothing is ever sent from them.
          VAR_SVC: ${{ vars.SUPABASE_SERVICE_KEY }}
          VAR_APP: ${{ vars.GMAIL_APP_PASSWORD }}
        run: |
          missing=""
          [ -z "$SVC" ] && missing="$missing SUPABASE_SERVICE_KEY"
          [ -z "$APP" ] && missing="$missing GMAIL_APP_PASSWORD"
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Both secrets are present. Sending."
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "NOT SENDING. Missing repository secret(s):$missing"
          echo ""
          if [ -n "$VAR_SVC" ] || [ -n "$VAR_APP" ]; then
            echo "They are set under VARIABLES, not SECRETS."
            echo "That settings page has two tabs and the workflow reads only Secrets."
            echo "Delete them from the Variables tab and add them again under Secrets."
            echo "This matters: a variable is not masked in logs, and a service_role"
            echo "key stored there is effectively published."
          else
            echo "Settings -> Secrets and variables -> Actions -> 'Secrets' tab"
            echo "  -> New repository secret."
            echo "Names must match exactly, including case:"
            echo "  SUPABASE_SERVICE_KEY   (Supabase -> Settings -> API -> service_role)"
            echo "  GMAIL_APP_PASSWORD     (Google Account -> Security -> App passwords)"
            echo ""
            echo "If you added them under an Environment rather than the repository,"
            echo "they will not resolve here either — this job declares no environment."
          fi

      - name: Send any new enquiries
        if: steps.gate.outputs.ready == 'true'
        env:
          SUPABASE_URL: https://iwwogjrnoacjnrpukzdb.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_USER: info@bpsquant.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: info@bpsquant.com
        run: python3 .github/scripts/notify_leads.py
